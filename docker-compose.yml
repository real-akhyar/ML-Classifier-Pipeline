version: '3.8'

services:
  ml-classifier-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-classifier-pipeline
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
